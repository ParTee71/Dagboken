# Provar GPR_TOKEN mot android-ui i GitHub Packages, så att en saknad eller felinklistrad secret
# stoppar på en sekund i stället för efter bygget (skill android:android-gradle-logic, ci-budget).
name: GPR_TOKEN når android-ui
description: Stoppar jobbet om GPR_TOKEN inte kan läsa android-ui
inputs:
  token:
    description: secrets.GPR_TOKEN (classic token, read:packages)
    required: true
runs:
  using: composite
  steps:
    - name: GPR_TOKEN når android-ui
      shell: bash
      env:
        GPR_TOKEN: ${{ inputs.token }}
      run: |
        # Kodhast först, ParTee71 som reserv – samma ordning som settings.gradle.kts (claude-android #80).
        codes=""
        for owner in Kodhast ParTee71; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "x:$GPR_TOKEN" \
            "https://maven.pkg.github.com/$owner/android-ui/se/partee71/ui/ui-theme/maven-metadata.xml")
          case "$code" in 200|302) codes=""; break ;; esac
          codes="$codes $owner:$code"
        done
        if [ -n "$codes" ]; then
          echo "::error::GPR_TOKEN fungerar inte – lägg in secreten på nytt (classic token, read:packages) (HTTP$codes)"; exit 1
        fi
