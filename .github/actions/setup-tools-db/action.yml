name: tools/db
description: >-
  Node 22 med npm-cache och tools/db:s beroenden, utan livscykelskript. Kräver att repot redan
  är utcheckat. Gemensamt för rules-tester, rules-deploy och backup (skill ci-budget).

inputs:
  omit-dev:
    description: "true: bara firebase-admin – inga utvecklingsverktyg (backupen)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tools/db/package-lock.json

    - name: Beroenden i tools/db
      shell: bash
      env:
        OMIT_DEV: ${{ inputs.omit-dev }}
      run: |
        if [ "$OMIT_DEV" = "true" ]; then
          npm ci --prefix tools/db --ignore-scripts --omit=dev
        else
          npm ci --prefix tools/db --ignore-scripts
        fi
