name: Dokumentkontroller
description: >-
  Node 22 och testkommandona som alltid körs (sekunder, inga beroenden):
  pluginens dokumentkontroll (CI-tabellen mot filtren, länkar och namn), repots
  skripttester i .github/scripts, regel 4-kontrollen (pluginens regel4-check.mjs --verify) och läkemedelslistans
  byggskript (tools/medicines). Kräver att repot redan är utcheckat.

runs:
  using: composite
  steps:
    - name: Node 22 (globmönster i node --test kräver Node 21+)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Dokumentkontrollen och regel 4-motorn finns i pluginen (claude-android #57 och #59, publikt
    # repo). Repot har sina filer; kontrollerna prövar dem mot pluginens kod och namn.
    - name: Pluginen claude-android
      uses: actions/checkout@v4
      with:
        repository: ParTee71/claude-android
        path: .claude-android
        sparse-checkout: plugins/android

    - name: Dokumentkontroller (länkar, skill- och agentnamn, CI-tabellen)
      shell: bash
      run: node .claude-android/plugins/android/checks/doc-checks.mjs .

    - name: Repots egna skripttester
      shell: bash
      run: node --test '.github/scripts/*.test.mjs'

    - name: Regel 4-kontrollen (regel4-check --verify)
      shell: bash
      run: node .claude-android/plugins/android/hooks/regel4-check.mjs --verify .

    - name: Läkemedelslistans byggskript (tools/medicines)
      shell: bash
      run: node --test 'tools/medicines/test/*.test.mjs'
