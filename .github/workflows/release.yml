name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.6.1) — leave blank to use value in build.gradle.kts'
        required: false
        type: string
      publish_release:
        description: 'Skapa taggen v<version_name> och publicera en GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # required to create a GitHub Release on tag push

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # En release startas antingen genom att pusha taggen vX.Y.Z, eller — när
      # tag-push inte är möjlig (agentsessioner får HTTP 403 på refs/tags/*) —
      # genom workflow_dispatch med publish_release ikryssad. I det senare fallet
      # skapas taggen av action-gh-release på den utcheckade committen.
      - name: Resolve release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ "${{ inputs.publish_release }}" = "true" ]; then
            if [ -z "${{ inputs.version_name }}" ]; then
              echo "::error::version_name måste anges när publish_release är ikryssad"
              exit 1
            fi
            tag="v${{ inputs.version_name }}"
            if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Taggen $tag finns redan — välj en ny version"
              exit 1
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > app/dagboken.jks

      - name: Convert keystore to legacy PKCS12
        run: |
          keytool -importkeystore \
            -srckeystore app/dagboken.jks \
            -srcstorepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -destkeystore app/dagboken-legacy.jks \
            -deststorepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -deststoretype pkcs12 \
            -J-Dkeystore.pkcs12.legacy \
            -noprompt
          mv app/dagboken-legacy.jks app/dagboken.jks

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            ./gradlew :app:assembleRelease \
              -PversionNameOverride="${{ inputs.version_name }}"
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dagboken-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Publish a GitHub Release with the signed APK + auto-generated changelog.
      # Vid tag-push, och vid workflow_dispatch med publish_release ikryssad
      # (taggen skapas då här). Övriga dispatch-körningar är artifact-only.
      - name: Publish GitHub Release
        if: steps.release_tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Dagboken ${{ steps.release_tag.outputs.name }}
          tag_name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Remove keystore
        if: always()
        run: rm -f app/dagboken.jks
