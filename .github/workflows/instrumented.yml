name: Instrumented Tests

on:
  pull_request:
    branches: [ master ]
    # Emulatorkörningen tar ~25-30 minuter. En PR som bara rör dokumentation innehåller
    # ingen kod att instrumenttesta och behöver inte betala den tiden. Filtret slår bara
    # till när *samtliga* ändrade filer matchar - rör PR:en även en enda kodfil körs
    # testerna som vanligt.
    #
    # build.gradle.kts står medvetet inte här. En releases versionshöjning rör den och
    # kör alltså fortfarande emulatorn, men filen bär också beroenden, minSdk och
    # testkörarkonfiguration - sådant som mycket väl kan fälla instrumenttesterna.
    #
    # Obs: en hoppad körning rapporterar ingen status alls. Görs instrumented-tests
    # någon gång till ett obligatoriskt statuskrav i grenskyddet måste filtret bort,
    # annars fastnar dokumentations-PR:er i väntan på en körning som aldrig startar.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          device: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 2048M
          emulator-options: -no-window -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest
            GRADLE_EXIT=$?
            adb -s emulator-5554 logcat -d > logcat.txt 2>&1 || touch logcat.txt
            exit $GRADLE_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-logcat
          path: logcat.txt
