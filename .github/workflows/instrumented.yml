# Instrumenttester på Android-emulator (skill ci-budget): i PR:er som rör koden de testar
# (android.yml, filtret instrumented), på begäran, och i release.yml när koden inte redan
# testats grönt i en PR.
name: Instrumenttester

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GPR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  instrumented:
    name: instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Emulatorn behöver ~7 GB för sin datadisk; runnern har för lite kvar när Firebase-
      # emulatorn också ligger på den. Ta bort förinstallerade verktyg vi aldrig använder.
      - name: Frigör disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/boost
          df -h / | tail -n1

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          token: ${{ secrets.GPR_TOKEN }}

      # Kontraktstestet för FirestoreCollection kör mot Firebase-emulatorerna (firestore + auth)
      # på värddatorn – aldrig mot den riktiga databasen.
      - uses: ./.github/actions/setup-tools-db
      - uses: ./.github/actions/setup-firebase-emulator

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Egen gräns under jobbets 30 minuter: ett test som hänger fäller steget i stället för jobbet,
      # så att "Fallerade tester" och testrapporten hinner köras.
      - name: Instrumenttester (API 36, samma som targetSdk)
        timeout-minutes: 15
        env:
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4G
          emulator-options: -no-window -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect
          script: npx --prefix tools/db firebase emulators:exec --only firestore,auth --project demo-dagboken "./gradlew --configuration-cache :app:connectedDebugAndroidTest"

      # connectedDebugAndroidTest skriver inga testnamn i loggen – fallerade tester och deras första
      # rader syns här och i jobbsammanfattningen, utan att artifacten behöver laddas ner.
      - name: Fallerade tester
        if: failure()
        shell: python3 {0}
        run: |
          import glob, os, xml.etree.ElementTree as ET
          lines = []
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(path).iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title=Instrumenttest::{name}")
                      detail = (bad.text or bad.get('message') or '').strip().splitlines()[:25]
                      print('\n'.join(detail))
                      lines += [f"### {name}", "```", *detail, "```"]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines or ['Inga testresultat hittades.']) + '\n')

      - name: Testrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumenttester
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
