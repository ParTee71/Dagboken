# Alla versioner på ett ställe – tagna från ReseApoteket (ADR-001), så att båda apparna bygger
# med samma verifierade uppsättning. Val och motivering: ReseApotekets ARKITEKTUR.md →
# "Byggkonfiguration" och "Verifierade API:er" (VerifiedApisTest bevisar dem här).
# Med avsikt finns även bibliotek som tas i bruk i senare etapper (DataStore för enhetslokalt
# tillstånd, WorkManager för påminnelser), så att versionerna valts tillsammans.

[versions]
agp                      = "9.4.1"
kotlin                   = "2.4.20"
ksp                      = "2.3.12"
composeBom               = "2026.09.00"
material3                = "1.5.0-alpha29"  # Expressive är internal i stabila 1.4.0 (ARKITEKTUR.md)
navigation3              = "1.2.0"
lifecycle                = "2.11.0"
activityCompose          = "1.13.0"
coreSplashscreen         = "1.2.0"
coreKtx                  = "1.19.1"
hilt                     = "2.60.1"
hiltLifecycle            = "1.4.0"
firebaseBom              = "34.19.0"
credentials              = "1.6.0"
googleid                 = "1.2.1"
datastore                = "1.2.1"
work                     = "2.12.0"
googleServices           = "4.5.0"
kotlinxSerialization     = "1.11.0"
kotlinxDatetime          = "0.8.0"
kotlinxCoroutines        = "1.11.0"
junit                    = "4.13.2"
robolectric              = "4.17"
roborazzi                = "1.76.0"
konsist                  = "0.17.3"
turbine                  = "1.2.1"
androidxTestRunner       = "1.7.0"
androidxTestExtJunit     = "1.3.0"
concurrentFutures        = "1.2.0"
errorProneAnnotations    = "2.30.0"
pmd                      = "7.28.0"
vico                     = "3.3.1"  # diagram (ui/diagram, TRD-6…18); 3.x använde 2.1.3

[libraries]
androidx-core-ktx                     = { group = "androidx.core",               name = "core-ktx",                          version.ref = "coreKtx" }
androidx-activity-compose             = { group = "androidx.activity",           name = "activity-compose",                  version.ref = "activityCompose" }
androidx-core-splashscreen            = { group = "androidx.core",               name = "core-splashscreen",                 version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-navigation3",   version.ref = "lifecycle" }
androidx-navigation3-runtime          = { group = "androidx.navigation3",        name = "navigation3-runtime",               version.ref = "navigation3" }
androidx-navigation3-ui               = { group = "androidx.navigation3",        name = "navigation3-ui",                    version.ref = "navigation3" }
androidx-compose-bom                  = { group = "androidx.compose",            name = "compose-bom",                       version.ref = "composeBom" }
androidx-compose-ui                   = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics          = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling           = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview   = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4       = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-ui-test-manifest     = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
androidx-compose-material3            = { group = "androidx.compose.material3",  name = "material3",                         version.ref = "material3" }
androidx-datastore-preferences        = { group = "androidx.datastore",          name = "datastore-preferences",             version.ref = "datastore" }
androidx-work-runtime                 = { group = "androidx.work",               name = "work-runtime",                      version.ref = "work" }
androidx-work-testing                 = { group = "androidx.work",               name = "work-testing",                      version.ref = "work" }
hilt-android                          = { group = "com.google.dagger",           name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                         = { group = "com.google.dagger",           name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose      = { group = "androidx.hilt",               name = "hilt-lifecycle-viewmodel-compose",  version.ref = "hiltLifecycle" }
firebase-bom                          = { group = "com.google.firebase",         name = "firebase-bom",                      version.ref = "firebaseBom" }
firebase-auth                         = { group = "com.google.firebase",         name = "firebase-auth" }
firebase-firestore                    = { group = "com.google.firebase",         name = "firebase-firestore" }
credentials                           = { group = "androidx.credentials",        name = "credentials",                       version.ref = "credentials" }
credentials-play-services             = { group = "androidx.credentials",        name = "credentials-play-services-auth",    version.ref = "credentials" }
googleid                              = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
kotlinx-serialization-json            = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",        version.ref = "kotlinxSerialization" }
kotlinx-datetime                      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-datetime",                  version.ref = "kotlinxDatetime" }
kotlinx-coroutines-android            = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",        version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-play-services      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-play-services",  version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test               = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",           version.ref = "kotlinxCoroutines" }
# Diagram: Vicos Compose-modul (bara i ui/diagram, ui-forbidden.txt [vico]). compose-m3 utelämnas med
# avsikt – den ger bara ett tema ur MaterialTheme.colorScheme; diagrammen tar färgerna ur AppColors.
vico-compose                          = { group = "com.patrykandpatrick.vico",   name = "compose",                           version.ref = "vico" }
# Test
junit                                 = { group = "junit",                       name = "junit",                             version.ref = "junit" }
kotlin-test                           = { group = "org.jetbrains.kotlin",        name = "kotlin-test",                       version.ref = "kotlin" }
robolectric                           = { group = "org.robolectric",             name = "robolectric",                       version.ref = "robolectric" }
roborazzi                             = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                       version.ref = "roborazzi" }
roborazzi-compose                     = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",               version.ref = "roborazzi" }
roborazzi-junit-rule                  = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",            version.ref = "roborazzi" }
androidx-test-runner                  = { group = "androidx.test",               name = "runner",                            version.ref = "androidxTestRunner" }
errorprone-annotations                = { group = "com.google.errorprone",       name = "error_prone_annotations",           version.ref = "errorProneAnnotations" }
androidx-concurrent-futures           = { group = "androidx.concurrent",         name = "concurrent-futures",                version.ref = "concurrentFutures" }
androidx-test-ext-junit               = { group = "androidx.test.ext",           name = "junit",                             version.ref = "androidxTestExtJunit" }
konsist                               = { group = "com.lemonappdev",             name = "konsist",                           version.ref = "konsist" }
turbine                               = { group = "app.cash.turbine",            name = "turbine",                           version.ref = "turbine" }
# Copy-paste-detektor (cpdCheck i rotens build.gradle.kts)
pmd-cli                               = { group = "net.sourceforge.pmd",         name = "pmd-cli",                           version.ref = "pmd" }
pmd-kotlin                            = { group = "net.sourceforge.pmd",         name = "pmd-kotlin",                        version.ref = "pmd" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
roborazzi            = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }
